apiVersion: apps/v1
kind: Deployment
metadata:
  name: neon-rift-runner
  labels:
    app: neon-rift-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neon-rift-runner
  template:
    metadata:
      labels:
        app: neon-rift-runner
    spec:
      containers:
        - name: web
          image: ghcr.io/sebby1770/neon-rift-runner:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.json
              port: 80
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health.json
              port: 80
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: neon-rift-runner
spec:
  type: ClusterIP
  selector:
    app: neon-rift-runner
  ports:
    - name: http
      port: 80
      targetPort: 80
